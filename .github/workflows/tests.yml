name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: headcount_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/headcount_test
      # A second database for the command-line smoke test below.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/headcount_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the command-line tools
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True).execute('CREATE DATABASE headcount_ci')"
          python -m headcount.migrate
          python -m headcount.migrate          # second run must be a no-op
          python -m headcount.seed
          python -m headcount.worker --once
          python -m headcount.reports --all > /dev/null
          python -m headcount.reports --format csv
