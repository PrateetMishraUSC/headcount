<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Headcount{% endblock %} · Headcount</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <nav class="page">
      <a class="brand" href="/">Headcount</a>
      <a href="/">Clubs</a>
      {% if viewer %}
        <a href="/me/rsvps">Your RSVPs</a>
        <a href="/notifications">Notifications{% if unread %} <span class="badge">{{ unread }}</span>{% endif %}</a>
        <span class="spacer"></span>
        <a class="who" href="/me/account">{{ viewer.display_name }}</a>
        <form method="post" action="/signout" class="inline"><button class="link">Sign out</button></form>
      {% else %}
        <span class="spacer"></span>
        <a href="/signin?next={{ request.url.path | urlencode }}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
